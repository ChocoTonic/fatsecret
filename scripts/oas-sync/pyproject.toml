[project]
name = "oas-sync"
version = "0.1.0"
description = "Deterministic crawler that derives an OpenAPI spec from FatSecret's published docs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.scripts]
oas-sync = "oas_sync.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oas_sync"]

[dependency-groups]
dev = ["pytest", "ruff"]
