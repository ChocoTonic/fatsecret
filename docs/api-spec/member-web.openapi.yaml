openapi: 3.1.0
info:
  title: FatSecret Member-Web Facade API
  version: 1.1.0
  description: |
    Manually maintained contract for a service that automates one authenticated
    FatSecret member account. These operations use unsupported HTML/WebForms at
    foods.fatsecret.com; they are not FatSecret Platform API endpoints and are
    not affiliated with or supported by FatSecret.

    FatSecret credentials are server-managed secrets and never appear in this
    API. Each caller identity is bound to one configured member account.
  x-contract-status: experimental
servers:
  - url: http://localhost:8000/v1
    description: Example local facade
security:
  - bearerAuth: []
tags:
  - name: RDI
  - name: Diary
  - name: Recipes
  - name: Ingredients
  - name: Foods
  - name: Operations
paths:
  /member/rdi:
    get:
      operationId: getMemberRdi
      summary: Get the member's saved RDI
      tags: [RDI]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: Current saved RDI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RdiSetting"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceMemberRdi
      summary: Replace the member's saved RDI
      description: |
        Preserves the member's current goal and physical-activity selections.
        The facade verifies the write by reading the diary back. A caller must
        reconcile with GET before retrying an ambiguous failure.
      tags: [RDI]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RdiReplace"
      responses:
        "200":
          description: Verified replacement result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RdiUpdate"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/diary/entries:
    get:
      operationId: listMemberDiaryEntries
      summary: List member diary entries for one epoch-day
      tags: [Diary]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      parameters:
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Fully hydrated diary entries.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DiaryEntry" }
                  count: { type: integer, minimum: 0 }
                additionalProperties: false
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMemberDiaryEntry
      summary: Add a food or owned recipe to the member diary
      description: |
        Omit portion_id to select grams when available, or the sole portion for
        an owned recipe. The member website persists gram amounts as integers.
      tags: [Diary]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: idempotency-key-required
      x-write-verification: required
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiaryEntryWrite" }
      responses:
        "201":
          description: Created and verified diary entry.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryEntry" }
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/diary/entries/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
      - $ref: "#/components/parameters/Date"
    get:
      operationId: getMemberDiaryEntry
      summary: Get one member diary entry
      tags: [Diary]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: Diary entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryEntry" }
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMemberDiaryEntry
      summary: Delete one member diary entry
      tags: [Diary]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      responses:
        "204": { description: Entry is absent. }
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/diary/items/{item_id}/portions:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - $ref: "#/components/parameters/Date"
    get:
      operationId: listMemberDiaryItemPortions
      summary: List diary portions for a food or owned recipe
      tags: [Diary]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: Available member-diary portions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiaryItemPortions" }
        default:
          $ref: "#/components/responses/Problem"

  /member/recipes:
    get:
      operationId: listMemberRecipes
      summary: List recipes owned by the member
      description: Returns summary rows without performing per-recipe hydration.
      tags: [Recipes]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: All owned recipe summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeSummary"
                  count:
                    type: integer
                    minimum: 0
                additionalProperties: false
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMemberRecipe
      summary: Create a private member recipe
      tags: [Recipes]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: idempotency-key-required
      x-write-verification: required
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeWrite"
      responses:
        "201":
          description: Recipe created and verified.
          headers:
            Location:
              description: URI of the created recipe.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/recipes/{recipe_id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      operationId: getMemberRecipe
      summary: Get an owned recipe
      tags: [Recipes]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: Hydrated recipe metadata and ingredients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceMemberRecipe
      summary: Replace an owned recipe
      description: Full replacement. Omitted writable fields are not preserved.
      tags: [Recipes]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeWrite"
      responses:
        "200":
          description: Verified replacement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "404":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMemberRecipe
      summary: Delete an owned recipe
      description: Returns success when the recipe is already absent.
      tags: [Recipes]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      responses:
        "204":
          description: Recipe is verified absent.
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/recipes/{recipe_id}/foods/{food_id}/portions:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      - $ref: "#/components/parameters/FoodId"
    get:
      operationId: listMemberFoodPortions
      summary: Resolve member-site portions for a known food ID
      description: |
        Performs no semantic food-name search. FatSecret resolves portions in
        the context of the destination recipe, so recipe_id is required.
      tags: [Foods]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: Portion choices currently offered by FatSecret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodPortions"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /member/recipes/{recipe_id}/ingredients:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      operationId: addMemberRecipeIngredient
      summary: Add a known food ID as a recipe ingredient
      description: V1 resolves and uses the food-specific grams portion.
      tags: [Ingredients]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: idempotency-key-required
      x-write-verification: required
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientWrite"
      responses:
        "201":
          description: Ingredient added and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeIngredient"
        "422":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/recipes/{recipe_id}/ingredients/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      - $ref: "#/components/parameters/EntryId"
    put:
      operationId: replaceMemberRecipeIngredient
      summary: Replace a recipe ingredient
      tags: [Ingredients]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientWrite"
      responses:
        "200":
          description: Ingredient replaced and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeIngredient"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMemberRecipeIngredient
      summary: Delete a recipe ingredient
      description: Returns success when the ingredient is already absent.
      tags: [Ingredients]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      responses:
        "204":
          description: Ingredient is verified absent.
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/recipes/{recipe_id}/copies:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      operationId: copyMemberRecipe
      summary: Start a durable copy of an owned recipe
      description: |
        Copies metadata and exact ingredient food, amount, and portion IDs.
        The operation is asynchronous because FatSecret can rate-limit the
        multi-request workflow. Reusing the same idempotency key and request
        returns the original operation.
      tags: [Recipes]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: idempotency-key-required
      x-write-verification: required
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeCopyRequest"
      responses:
        "202":
          description: Copy operation accepted or previously accepted.
          headers:
            Location:
              description: URI of the durable copy operation.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeCopyOperation"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

  /member/operations/{operation_id}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getMemberOperation
      summary: Get a durable member operation
      tags: [Operations]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: safe
      responses:
        "200":
          description: Current operation status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeCopyOperation"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /member/operations/{operation_id}/resume:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: resumeMemberOperation
      summary: Resume a waiting or reconciled member operation
      tags: [Operations]
      x-fatsecret-interface: member-website
      x-support-status: unofficial
      x-implementation-status: adapter-implemented
      x-upstream-stability: unstable
      x-retry-policy: reconcile-before-retry
      x-write-verification: required
      responses:
        "202":
          description: Resume accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeCopyOperation"
        "404":
          $ref: "#/components/responses/Problem"
        "504":
          $ref: "#/components/responses/AmbiguousWrite"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Facade credential; never a FatSecret password or session cookie.
  parameters:
    RecipeId:
      name: recipe_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FoodId:
      name: food_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Date:
      name: date
      in: query
      required: true
      description: Whole days since 1970-01-01.
      schema:
        type: integer
        format: int64
        minimum: 0
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key retained by the facade to prevent duplicate creates.
      schema:
        type: string
        minLength: 8
        maxLength: 255
  responses:
    Problem:
      description: Request, authentication, state, or upstream integration failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AmbiguousWrite:
      description: Upstream timed out or changed state without a verifiable result. Reconcile before retrying.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.invalid/problems/upstream-write-ambiguous
            title: Upstream write outcome is unknown
            status: 504
            code: upstream_write_ambiguous
            retryable: false
            upstream_outcome: unknown
  schemas:
    DecimalString:
      type: string
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      examples: ["15", "123.45"]
    PositiveDecimalString:
      type: string
      pattern: "^(?:[1-9][0-9]*(?:\\.[0-9]+)?|0\\.(?:0*[1-9][0-9]*))$"
      examples: ["0.5", "15", "123.45"]
    Nutrition:
      type: object
      properties:
        calories: { $ref: "#/components/schemas/DecimalString" }
        fat_g: { $ref: "#/components/schemas/DecimalString" }
        saturated_fat_g: { $ref: "#/components/schemas/DecimalString" }
        unsaturated_fat_g: { $ref: "#/components/schemas/DecimalString" }
        carbohydrate_g: { $ref: "#/components/schemas/DecimalString" }
        fiber_g: { $ref: "#/components/schemas/DecimalString" }
        sugar_g: { $ref: "#/components/schemas/DecimalString" }
        protein_g: { $ref: "#/components/schemas/DecimalString" }
        cholesterol_mg: { $ref: "#/components/schemas/DecimalString" }
        sodium_mg: { $ref: "#/components/schemas/DecimalString" }
      additionalProperties: false
    DiaryMeal:
      type: string
      enum: [breakfast, lunch, dinner, other]
    DiaryPortion:
      type: object
      required: [portion_id, label, is_grams]
      properties:
        portion_id:
          type: integer
          format: int64
          description: May be 0 for an owned recipe or -1 for grams.
        label: { type: string, minLength: 1 }
        is_grams: { type: boolean }
      additionalProperties: false
    DiaryItemPortions:
      type: object
      required: [item_id, item_name, portions]
      properties:
        item_id: { type: integer, format: int64, minimum: 1 }
        item_name: { type: string, minLength: 1 }
        portions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DiaryPortion" }
      additionalProperties: false
    DiaryEntryWrite:
      type: object
      required: [item_id, entry_name, amount, meal, date]
      properties:
        item_id: { type: integer, format: int64, minimum: 1 }
        entry_name: { type: string, minLength: 1, maxLength: 255 }
        amount: { $ref: "#/components/schemas/PositiveDecimalString" }
        meal: { $ref: "#/components/schemas/DiaryMeal" }
        date:
          type: integer
          format: int64
          minimum: 0
          description: Whole days since 1970-01-01.
        portion_id:
          type: [integer, "null"]
          format: int64
          description: Omit for grams or the sole owned-recipe serving.
      additionalProperties: false
    DiaryEntry:
      type: object
      required:
        - entry_id
        - item_id
        - entry_name
        - amount
        - portion_id
        - portion_name
        - meal
        - date
        - edit_url
      properties:
        entry_id: { type: integer, format: int64, minimum: 1 }
        item_id: { type: integer, format: int64, minimum: 1 }
        entry_name: { type: string, minLength: 1 }
        amount: { $ref: "#/components/schemas/PositiveDecimalString" }
        portion_id:
          type: integer
          format: int64
          description: May be 0 for an owned recipe or -1 for grams.
        portion_name: { type: string, minLength: 1 }
        meal: { $ref: "#/components/schemas/DiaryMeal" }
        date: { type: integer, format: int64, minimum: 0 }
        edit_url: { type: string, format: uri }
      additionalProperties: false
    RecipeSummary:
      type: object
      required: [recipe_id, title, description, status, nutrition, preview_url, edit_url]
      properties:
        recipe_id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, minLength: 1 }
        nutrition: { $ref: "#/components/schemas/Nutrition" }
        preview_url: { type: string, format: uri }
        edit_url: { type: string, format: uri }
      additionalProperties: false
    RecipeDetail:
      type: object
      required:
        - recipe_id
        - title
        - description
        - status
        - nutrition_per_serving
        - preview_url
        - edit_url
        - servings
        - prep_minutes
        - cook_minutes
        - meal_types
        - directions
        - sharing
        - ingredients
      properties:
        recipe_id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, minLength: 1 }
        nutrition_per_serving: { $ref: "#/components/schemas/Nutrition" }
        preview_url: { type: string, format: uri }
        edit_url: { type: string, format: uri }
        author: { type: [string, "null"] }
        date_published: { type: [string, "null"], format: date }
        servings: { $ref: "#/components/schemas/PositiveDecimalString" }
        prep_minutes: { type: integer, minimum: 0 }
        cook_minutes: { type: integer, minimum: 0 }
        meal_types:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/MealType" }
        directions:
          type: array
          items: { type: string, minLength: 1 }
        sharing: { type: boolean }
        images:
          type: array
          items: { type: string, format: uri }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/RecipeIngredient" }
      additionalProperties: false
    RecipeWrite:
      type: object
      required: [title, description, servings, prep_minutes, cook_minutes, meal_types, directions]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        servings: { $ref: "#/components/schemas/PositiveDecimalString" }
        prep_minutes: { type: integer, minimum: 0 }
        cook_minutes: { type: integer, minimum: 0 }
        meal_types:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/MealType" }
        directions:
          type: array
          items: { type: string, minLength: 1 }
      additionalProperties: false
    MealType:
      type: string
      enum:
        - appetizers
        - soups
        - main_dishes
        - side_dishes
        - breads_and_baked_products
        - salads_and_salad_dressings
        - sauces_and_condiments
        - desserts
        - snacks
        - beverages
        - other
        - breakfast
        - lunch
    IngredientWrite:
      type: object
      required: [food_id, amount]
      properties:
        food_id: { type: integer, format: int64, minimum: 1 }
        amount: { $ref: "#/components/schemas/PositiveDecimalString" }
        unit:
          type: [string, "null"]
          enum: [grams, null]
          description: Omit to use grams by default; incompatible with portion_id.
        portion_id:
          type: integer
          format: int64
          not: { const: 0 }
          description: Exact opaque portion ID; omitted values resolve to grams.
      additionalProperties: false
    RecipeIngredient:
      type: object
      required: [entry_id, food_id, name, amount, portion_id, portion_name, display_text, nutrition_total]
      properties:
        entry_id: { type: integer, format: int64, minimum: 1 }
        food_id: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1 }
        amount: { $ref: "#/components/schemas/PositiveDecimalString" }
        portion_id: { type: integer, format: int64, not: { const: 0 } }
        portion_name: { type: string, minLength: 1 }
        display_text: { type: string, minLength: 1 }
        nutrition_total: { $ref: "#/components/schemas/Nutrition" }
      additionalProperties: false
    PortionChoice:
      type: object
      required: [portion_id, label, is_grams]
      properties:
        portion_id: { type: integer, format: int64, not: { const: 0 } }
        label: { type: string, minLength: 1 }
        is_grams: { type: boolean }
      additionalProperties: false
    FoodPortions:
      type: object
      required: [food_id, food_name, portions]
      properties:
        food_id: { type: integer, format: int64, minimum: 1 }
        food_name: { type: string, minLength: 1 }
        portions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PortionChoice" }
      additionalProperties: false
    RecipeCopyRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
      additionalProperties: false
    RecipeCopyOperation:
      type: object
      required:
        - operation_id
        - status
        - source_recipe_id
        - target_title
        - completed_ingredient_count
        - created_at
        - updated_at
      properties:
        operation_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [pending, running, waiting, completed, failed, unknown]
        source_recipe_id: { type: integer, format: int64, minimum: 1 }
        target_title: { type: string, minLength: 1 }
        target_recipe_id: { type: [integer, "null"], format: int64, minimum: 1 }
        completed_ingredient_count: { type: integer, minimum: 0 }
        total_ingredient_count: { type: [integer, "null"], minimum: 0 }
        retry_after: { type: [string, "null"], format: date-time }
        result:
          oneOf:
            - $ref: "#/components/schemas/RecipeDetail"
            - type: "null"
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    RdiSetting:
      type: object
      required: [calories_per_day, effective_date]
      properties:
        calories_per_day: { type: integer, minimum: 1, maximum: 100000 }
        effective_date: { type: string, format: date }
      additionalProperties: false
    RdiReplace:
      type: object
      required: [calories_per_day]
      properties:
        calories_per_day: { type: integer, minimum: 1, maximum: 100000 }
      additionalProperties: false
    RdiUpdate:
      type: object
      required: [requested_calories_per_day, previous, current]
      properties:
        requested_calories_per_day: { type: integer, minimum: 1, maximum: 100000 }
        previous: { $ref: "#/components/schemas/RdiSetting" }
        current: { $ref: "#/components/schemas/RdiSetting" }
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string, minLength: 1 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, minLength: 1 }
        retryable: { type: boolean }
        upstream_outcome:
          type: string
          enum: [not_attempted, known_not_applied, applied, unknown]
      additionalProperties: false
