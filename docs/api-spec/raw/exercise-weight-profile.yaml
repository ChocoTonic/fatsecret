endpoints:
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/exercise_entries.commit_day
  exists: true
  http_verb: POST
  method: exercise_entries.commit_day
  notes: Saves the default exercise entries for the user on a nominated date. The API will always return
    24 hours worth of exercise entries for a given user on a given date. Users can set up and save standard
    routines for the activities they do on any given day of the week, known as "template" exercise entries.
    When the exercise entries are retrieved for a day that has not previously been committed or adjusted
    by the user a set of 24 hours worth of "template" or default entries will be returned. The exercise_entries.commit_day
    method takes the current "template" exercise entries and saves them to the exercise diary. Calling
    this method is in effect an acknowledgement on behalf of a user that they undertook the activities
    presented in the template.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
- api_method_param: null
  deprecated: true
  doc_url: https://platform.fatsecret.com/docs/v1/exercise_entries.get
  exists: true
  http_verb: GET
  method: exercise_entries.get
  notes: Returns the daily exercise entries for the user on a nominated date. The API will always return
    24 hours worth of exercise entries for a given user on a given date. These entries will either be
    "template" entries (which a user may override for any given day of the week) or saved exercise entry
    values. Once a user saves or updates the entries on any given day, all entries for that day are saved.
    All adjustments to the day involve reducing the time for an existing activity in order to either add
    or increase the time taken for another activity. The default entries presented for a user for a given
    day of the week can be overridden using exercise_entries.save_template.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  parse_warnings: []
  premier: true
  response:
    exercise_entries:
      exercise_entry:
      - {}
  rest_url: null
  scope: basic
  version: v1
