- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/weight.update
  exists: true
  http_verb: POST
  method: weight.update
  notes: Records a user's weight for a nominated date. First time weigh-ins require the goal_weight_kg
    and current_height_cm parameters. Please note as per the API Terms of Use that it is your responsibility
    to ensure that the information generated by using the API is not be interpreted as a substitute for
    medical physician consultation, evaluation, or treatment.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Current weight of the user in kilograms
    name: current_weight_kg
    required: true
    type: Decimal
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  - default: null
    description: Weight measurement type for this user profile. Valid types are "kg" and "lb" (default
      value is "kg")
    name: weight_type
    required: false
    type: String
  - default: null
    description: Height measurement type for this user profile. Valid types are "cm" and "inch" (default
      value is "cm")
    name: height_type
    required: false
    type: String
  - default: null
    description: User's goal weight in kilograms
    name: goal_weight_kg
    required: false
    type: Decimal
  - default: null
    description: Current height of the user in centimetres. This is required for the first weigh-in. You
      can only set this for the first time
    name: current_height_cm
    required: false
    type: Decimal
  - default: null
    description: A comment for this weigh-in
    name: comment
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
