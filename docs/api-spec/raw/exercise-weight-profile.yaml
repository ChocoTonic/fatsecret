- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/profile.create
  exists: true
  http_verb: POST
  method: profile.create
  notes: Creates a new profile and returns the oauth_token and oauth_secret for the new profile. The token
    and secret returned by this method are persisted indefinitely and may be used in order to provide
    profile-specific information storage for users including food and exercise diaries and weight tracking.
    The response is a newly allocated oauth_token and associated oauth_secret which should be stored and
    re-used to provide ongoing API services on behalf of a user. The results from this call should be
    saved and subsequently used to provide ongoing storage to users of your site or service. You are obliged
    to ensure that the values are held securely and to not disclose any oauth_secret values. You should
    maintain the relationship between your users and the token and secret values you allocate for them.
    In addition to creating profiles for your own users, you can also use the full 3-legged OAuth provided
    by fatsecret.com to attain an access token for a profile that is linked to a user account on fatsecret.com.
    For more information click here.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: You can set your own ID for the newly created profile if you do not wish to store the
      auth_token and auth_secret
    name: user_id
    required: true
    type: String
  parse_warnings: []
  premier: true
  response:
    profile: {}
  rest_url: null
  scope: basic
  version: v1
