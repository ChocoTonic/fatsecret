- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/exercise_entries.save_template
  exists: true
  http_verb: POST
  method: exercise_entries.save_template
  notes: 'Takes the set of exercise entries on a nominated date and saves these entries as "template"
    entries for nominated days of the week. By default, the template daily exercise entries for all users
    for all days of the week are: his method is used to take the saved entries on for a nominated date
    and to copy them for one or more days of the week as the template daily exercise entries. So, for
    instance, if a user records 1 hour of walking, 8 hours of sleeping and 15 hours of resting for a particular
    day in their exercise diary, and then saves that date as a template for Saturday and Sunday, these
    three activities will be presented as the default exercise entries for all future Saturdays and Sundays.'
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: The days of the week specified as bits with Sunday being the 1st bit and Saturday being
      the last and then converted to an Int. For example Tuesday and Thursday would be represented as
      00010100 in bits or 20 in Int where Tuesday is the 3rd bit from the right and Thursday being the
      5th. Must be between 0 and 128
    name: days
    required: true
    type: Int
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/exercise_entry.edit
  exists: true
  http_verb: PUT
  method: exercise_entry.edit
  notes: Records a change to a user's exercise diary entry for a nominated date. All changes to an exercise
    diary involve either increasing the duration of an existing activity or introducing a new activity
    for a nominated duration. Because there are always 24 hours worth of exercise entries on any given
    date, the user must nominate the exercise or activity from which the time was taken to balance out
    the total duration of activities and exercises for the 24 hour period. As such, each change to the
    exercise entries on a given day is a "shifting" operation where time is moved from one activity to
    another. An exercise is removed from the day when all of the time allocated to it is shifted to other
    exercises.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: ID of the exercise type to shift to
    name: shift_to_id
    required: true
    type: Long
  - default: null
    description: ID of the exercise type to shift from
    name: shift_from_id
    required: true
    type: Long
  - default: null
    description: Duration in minutes
    name: minutes
    required: true
    type: Int
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  - default: null
    description: Only required if shift_to_id is 0 (exercise type "Other"). This is the name of the new
      custom exercise type to shift to
    name: shift_to_name
    required: false
    type: String
  - default: null
    description: Only required if shift_from_id is 0 (exercise type "Other"). This is the name of the
      custom exercise type to shift from
    name: shift_from_name
    required: false
    type: String
  - default: null
    description: Only required if shift_to_id is 0 (exercise type "Other"). This is the total number of
      kcals burned for this exercise
    name: kcal
    required: false
    type: Int
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
