  doc_url: https://platform.fatsecret.com/docs/v1/image.recognition
  exists: true
  http_verb: POST
  method: image.recognition
  notes: 'This API detects foods within an image and returns a list of foods from the fatsecret database
    By passing a list of eaten foods, we will also attempt to determine if any of the inputs match in
    order to improve the accuracy of the response. NOTE: If an appropriate serving is not found, nutritional
    information may not be present. This typically occurs when a non-standard serving description is provided
    for a restaurant-based food. In such scenarios, we recommend using the default serving size returned
    via the API, indicated by the serving object with "is_default": true. Additionally, for mobile app
    interfaces, we recommend not automatically logging all foods and associated serving amounts directly
    into the user''s food diary. Instead, we recommend displaying an intermittent screen that allows the
    user to: This approach improves user experience and ensures more accurate food diary entries. NOTE:
    The entire request body is limited to 1MB characters (1.048M) and as such we recommend to check the
    request size before hitting the API.'
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: A Base64 image of one or more foods. This field is limited to 999,982 characters
    name: image_b64
    required: true
    type: String
  - default: null
    description: Include full food data in the response (see our food.get API)
    name: include_food_data
    required: false
    type: Bool
  - default: null
    description: An array of previously consumed foods. This may be provided to assist with more accurate
      matching of foods identified in the input with previously consumed foods
    name: eaten_foods
    required: false
    type: Array
  - default: null
    description: The ID of the food that has been previously consumed
    name: eaten_foods.food_id
    required: true
    type: Long
  - default: null
    description: The name of the food that has been previously consumed
    name: eaten_foods.food_name
    required: true
    type: String
  - default: null
    description: The brand name of the food that has been previously consumed
    name: eaten_foods.food_brand
    required: false
    type: String
  - default: null
    description: The serving description of the food that has been previously consumed
    name: eaten_foods.serving_description
    required: false
    type: String
  - default: null
    description: The serving size of the food that has been previously consumed
    name: eaten_foods.serving_size
    required: false
    type: String
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    food_response:
    - {}
  rest_url: https://platform.fatsecret.com/rest/image-recognition/v1
  scope: basic
  version: v1
