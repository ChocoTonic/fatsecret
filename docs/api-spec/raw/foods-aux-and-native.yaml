endpoints:
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/feedback
  exists: true
  http_verb: POST
  method: feedback
  notes: ''
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: A barcode where a food is associated incorrectly. Required when issue_type_id is 1
    name: barcode
    required: true
    type: Int
  - default: null
    description: The type ID for the request. Valid options are 1 (Wrong Name/Brand), 2 (Wrong Nutrition
      Info), 3 (Missing Serving Size), 4 (Barcode not found), 99 (Other)
    name: issue_type_id
    required: true
    type: Int
  - default: null
    description: Issue description. This is to be provided when the issue_type_id is 99 (Other)
    name: issue_type
    required: false
    type: String
  - default: null
    description: Custom notes regarding the issue
    name: notes
    required: false
    type: String
  - default: null
    description: Custom identifier for external use. E.g an external unique user identifier
    name: external_id
    required: true
    type: String
  - default: null
    description: A food ID that is related to the issue (i.e. barcode incorrect food attached). Required
      when issue_type_id is 1, 2 or 3
    name: returned_food.food_id
    required: false
    type: Int
  - default: null
    description: A foods serving ID that is related to the issue (i.e. incorrect nutrient information).
      Required when issue_type_id is 2 or 3
    name: returned_food.serving_id
    required: false
    type: Int
  - default: null
    description: The image file extension in which the signed uploads will be generated using. Accepts
      jpg, jpeg, png and tiff. Defaulted to jpg if not provided
    name: image_file_extension
    required: false
    type: String
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response: {}
  rest_url: https://platform.fatsecret.com/rest/feedback/v1
  scope: barcode
  version: v1
