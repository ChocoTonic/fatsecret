    By passing a list of eaten foods, we will also attempt to determine if any of the inputs match in
    order to improve the accuracy of the response. Example: For breakfast I ate a slice of toast with
    butter NOTE: If an appropriate serving is not found, nutritional information may not be present. This
    will typically occur for a non-standard serving description provided for a restaurant based food.
    NOTE: The request body may not exceed 1MB in size. This is inclusive of all body parameters.'
