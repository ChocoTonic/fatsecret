endpoints:
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/feedback
  exists: true
  http_verb: POST
  method: feedback
  notes: This API method enables developers to submit user feedback regarding potentially incorrect or
    missing food and/or barcode data. It supports a variety of issue types, including potential food or
    brand naming errors, incorrect nutrition facts, missing serving sizes, and unrecognized barcodes.
    To facilitate rapid verification, the API returns signed upload URLs, allowing developers to optionally
    (but ideally) upload up to three user submitted supporting images of the Barcode, Packaging, and Nutrition
    Facts via subsequent PUT requests. The subsequent PUT requests will be required to use both the provided
    URL and the "contentTypeHeader" field in the response as a 'Content-Type' header to successfully validate
    with the signed upload URL(s)
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: A barcode where a food is associated incorrectly. Required when issue_type_id is 1
    name: barcode
    required: true
    type: Int
  - default: null
    description: The type ID for the request. Valid options are 1 (Wrong Name/Brand), 2 (Wrong Nutrition
      Info), 3 (Missing Serving Size), 4 (Barcode not found), 99 (Other)
    name: issue_type_id
    required: true
    type: Int
  - default: null
    description: Issue description. This is to be provided when the issue_type_id is 99 (Other)
    name: issue_type
    required: false
    type: String
  - default: null
    description: Custom notes regarding the issue
    name: notes
    required: false
    type: String
  - default: null
    description: Custom identifier for external use. E.g an external unique user identifier
    name: external_id
    required: true
    type: String
  - default: null
    description: A food ID that is related to the issue (i.e. barcode incorrect food attached). Required
      when issue_type_id is 1, 2 or 3
    name: returned_food.food_id
    required: false
    type: Int
  - default: null
    description: A foods serving ID that is related to the issue (i.e. incorrect nutrient information).
      Required when issue_type_id is 2 or 3
    name: returned_food.serving_id
    required: false
    type: Int
  - default: null
    description: The image file extension in which the signed uploads will be generated using. Accepts
      jpg, jpeg, png and tiff. Defaulted to jpg if not provided
    name: image_file_extension
    required: false
    type: String
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response: {}
  rest_url: https://platform.fatsecret.com/rest/feedback/v1
  scope: barcode
  version: v1
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/food.find_id_for_barcode
  exists: true
  http_verb: GET
  method: food.find_id_for_barcode
  notes: Returns the food_id matching the barcode specified. Barcodes must be specified as GTIN-13 numbers
    - a 13-digit number filled in with zeros for the spaces to the left. UPC-A, EAN-13 and EAN-8 barcodes
    may be specified. UPC-E barcodes should be converted to their UPC-A equivalent (and then specified
    as GTIN-13 numbers). An interactive demonstration of our Barcode API can be accessed here
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: 13-digit GTIN-13 formatted sequence of digits representing the barcode to search against
    name: barcode
    required: true
    type: String
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    food_id: ''
  rest_url: null
  scope: basic
  version: v1
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v2/food.find_id_for_barcode
  exists: true
  http_verb: GET
  method: food.find_id_for_barcode
  notes: Returns detailed nutritional information for the specified food matching the barcode specified.
    Barcodes must be specified as GTIN-13 numbers - a 13-digit number filled in with zeros for the spaces
    to the left. UPC-A, EAN-13 and EAN-8 barcodes may be specified. UPC-E barcodes should be converted
    to their UPC-A equivalent (and then specified as GTIN-13 numbers). An interactive demonstration of
    our Barcode API can be accessed here
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: 13-digit GTIN-13 formatted sequence of digits representing the barcode to search against
    name: barcode
    required: true
    type: String
  - default: null
    description: Response will include the names of all sub categories associated with the food
    name: include_sub_categories
    required: false
    type: Boolean
  - default: null
    description: Response will include food image in the response. (Requires separate premier offering,
      please contact us in order for this feature to be enabled for your account)
    name: include_food_images
    required: false
    type: Boolean
  - default: null
    description: Response will include food dietary preferences and allergens if available. (Requires
      separate premier offering, please contact us in order for this feature to be enabled for your account)
    name: include_food_attributes
    required: false
    type: Boolean
  - default: null
    description: Either "true" or "false" - the response will flag one of the servings as the default
      serving (the suggested or most commonly chosen option)
    name: flag_default_serving
    required: false
    type: Boolean
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    food: {}
  rest_url: null
  scope: basic
  version: v2
