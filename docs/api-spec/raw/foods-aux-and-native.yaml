  method: image.recognition
  notes: 'This API identifies food items and their corresponding portion sizes or weights within an image.
    It returns a list of matched foods from the local, verified fatsecret country database, along with
    detailed nutritional information for each detected portion. By passing a list of eaten foods, we will
    also attempt to determine if any of the inputs match in order to improve the accuracy of the response.
    NOTE: If an appropriate serving is not found, nutritional information may not be present. This typically
    occurs when a non-standard serving description is provided for a restaurant-based food. In such scenarios,
    we recommend using the default serving size returned via the API, indicated by the serving object
    with "is_default": true. Additionally, for mobile app interfaces, we recommend not automatically logging
    all foods and associated serving amounts directly into the user''s food diary. Instead, we recommend
    displaying an intermittent screen that allows the user to: This approach improves user experience
    and ensures more accurate food diary entries. We support jpg, png and webp formats, with a size of
    up to 1.09MB. We recommend resizing images to a resolution of either 256x256 or 512x512 pixels.'
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: A Base64 image of one or more foods. This field is limited to 999,982 characters
    name: image_b64
    required: true
    type: String
  - default: null
    description: Include full food data in the response (see our food.get API)
    name: include_food_data
    required: false
    type: Bool
  - default: null
    description: An array of previously consumed foods. This may be provided to assist with more accurate
      matching of foods identified in the input with previously consumed foods
    name: eaten_foods
    required: false
    type: Array
  - default: null
    description: The ID of the food that has been previously consumed
    name: eaten_foods.food_id
    required: true
    type: Long
  - default: null
    description: The name of the food that has been previously consumed
    name: eaten_foods.food_name
    required: true
    type: String
  - default: null
    description: The brand name of the food that has been previously consumed
    name: eaten_foods.food_brand
