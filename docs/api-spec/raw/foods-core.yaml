- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/foods.search
  exists: true
  http_verb: GET
  method: foods.search
  notes: Conducts a search of the food database using the search expression specified. The results are
    paginated according to a zero-based "page" offset. Successive pages of results may be retrieved by
    specifying a starting page offset value. For instance, specifying a max_results of 10 and page_number
    of 4 will return results numbered 41-50. Search results will be refined according to the user's prior
    saved food entries. An interactive demonstration of our Food Search API can be accessed here
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Search expression to match on food names
    name: search_expression
    required: false
    type: String
  - default: null
    description: Zero-based offset into the results for the query
    name: page_number
    required: false
    type: Int
  - default: null
    description: Maximum number of results to return (default value is 20). This number cannot be greater
      than 50
    name: max_results
    required: false
    type: Int
  - default: null
    description: 'Either "weight" or "portion": Weight (default) - the summary description for key nutritional
      values is displayed by weight (typically 100g); E.G.: "Per 100g". Portion - the summary description
      for key nutritional values is displayed using the default portion size; E.G.: "Per 1 Cup"

      Note that the summary nutrition description for "Brand" food items is always shown using a "portion"
      based description'
    name: generic_description
    required: false
    type: String
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    foods:
      food:
      - {}
  rest_url: null
  scope: basic
  version: v1
