endpoints:
- api_method_param: null
  deprecated: true
  doc_url: https://platform.fatsecret.com/docs/v1/food.get
  exists: true
  http_verb: GET
  method: food.get
  notes: Returns detailed nutritional information for the specified food for each available standard serving
    size. Use this call to display nutrition values for a food to users.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Unique food identifier
    name: food_id
    required: true
    type: Long
  - default: null
    description: Response will include the names of all sub categories associated with the food
    name: include_sub_categories
    required: false
    type: Boolean
  - default: null
    description: Either "true" or "false" - the response will flag one of the servings as the default
      serving (the suggested or most commonly chosen option)
    name: flag_default_serving
    required: false
    type: Boolean
  - default: null
    description: "Results will be filtered by region. E.G.: \"FR\" returns results from France. If not\
      \ specified this will default to \"US\" (United States).\n                    Click here for full\
      \ documentation on localization."
    name: region
    required: false
    type: String
  - default: null
    description: '(Ignored unless region is also specified) Results will be in the specified language.
      E.G.: "fr" returns results in French'
    name: language
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    food: {}
  rest_url: null
  scope: basic
  version: v1
