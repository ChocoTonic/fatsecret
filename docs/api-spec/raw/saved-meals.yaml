  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Unique saved meal identifier
    name: saved_meal_id
    required: true
    type: Long
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/saved_meal.edit
  exists: true
