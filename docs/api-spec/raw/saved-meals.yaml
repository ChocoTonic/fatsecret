- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/saved_meal_item.edit
  exists: true
  http_verb: PUT
  method: saved_meal_item.edit
  notes: Records a change to a user's saved meal item. Note that the serving_id of the saved meal item
    may not be adjusted, however one or more of the other remaining properties – saved_meal_item_name
    or number_of_units may be altered. In order to adjust a serving_id for which a saved_meal_item was
    recorded the original item must be deleted and a new item recorded.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Unique saved meal item identifier
    name: saved_meal_item_id
    required: true
    type: Long
  - default: null
    description: New name of the saved meal item
    name: saved_meal_item_name
    required: false
    type: String
  - default: null
    description: Number of units in this standard serving size. For instance, if the serving description
      is "2 tablespoons" the number of units is "2", while if the serving size is "1 cup" the number of
      units is "1". Please note that this is only applicable for when food_type is "Generic" whereas for
      "Brand" the number of units will always be "1"
    name: number_of_units
    required: false
    type: Decimal
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
