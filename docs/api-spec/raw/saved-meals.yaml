endpoints:
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/saved_meal.create
  exists: true
  http_verb: POST
  method: saved_meal.create
  notes: Records a saved meal for the user according to the parameters specified. The result of the call
    is the new unique identifier of the newly created saved meal.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: New name of the saved meal
    name: saved_meal_name
    required: true
    type: String
  - default: null
    description: New description of the saved meal
    name: saved_meal_description
    required: false
    type: String
  - default: null
    description: Comma separated list of meals the saved meal is suitable for
    name: meals
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    saved_meal_id: ''
  rest_url: null
  scope: basic
  version: v1
