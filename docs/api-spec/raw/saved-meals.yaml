    name: saved_meal_description
    required: false
    type: String
  - default: null
    description: Comma separated list of meals the saved meal is suitable for
    name: meals
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
