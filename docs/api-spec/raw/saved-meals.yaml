- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/saved_meal_item.add
  exists: true
  http_verb: POST
  method: saved_meal_item.add
  notes: Adds a food to a user's saved meal according to the parameters specified. The result of the call
    is the new unique identifier of the newly created saved meal item.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Unique saved meal identifier
    name: saved_meal_id
    required: true
    type: Long
  - default: null
    description: Unique food identifier
    name: food_id
    required: true
    type: Long
  - default: null
    description: New name of the saved meal item
    name: saved_meal_item_name
    required: true
    type: String
  - default: null
    description: Unique serving identifier
    name: serving_id
    required: true
    type: Long
  - default: null
    description: Number of units in this standard serving size. For instance, if the serving description
      is "2 tablespoons" the number of units is "2", while if the serving size is "1 cup" the number of
      units is "1". Please note that this is only applicable for when food_type is "Generic" whereas for
      "Brand" the number of units will always be "1"
    name: number_of_units
    required: true
    type: Decimal
  parse_warnings: []
  premier: true
  response:
    saved_meal_item_id: ''
  rest_url: null
  scope: basic
  version: v1
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/saved_meal_item.delete
