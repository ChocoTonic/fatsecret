endpoints:
- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/food_entries.copy
  exists: true
  http_verb: POST
  method: food_entries.copy
  notes: Copies the food entries for a specified meal from a nominated date to a nominated date.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Date to copy food entries from expressed in the number of days since January 1, 1970
    name: from_date
    required: true
    type: Int
  - default: null
    description: Date to copy food entries to expressed in the number of days since January 1, 1970 (default
      value is the current day)
    name: to_date
    required: true
    type: Int
  - default: null
    description: Type of meal eaten. Valid meal types are "breakfast", "lunch", "dinner" and "other"
    name: meal
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
