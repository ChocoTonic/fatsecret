- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/food_entry.create
  exists: true
  http_verb: POST
  method: food_entry.create
  notes: Records a food diary entry for the user according to the parameters specified.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Unique food identifier
    name: food_id
    required: true
    type: Long
  - default: null
    description: 'A description of the food item as entered by the user; typically the name of the food.
      E.G.: "Instant Oatmeal"'
    name: food_entry_name
    required: true
    type: String
  - default: null
    description: Unique serving identifier
    name: serving_id
    required: true
    type: Long
  - default: null
    description: Number of units in this standard serving size. For instance, if the serving description
      is "2 tablespoons" the number of units is "2", while if the serving size is "1 cup" the number of
      units is "1". Please note that this is only applicable for when food_type is "Generic" whereas for
      "Brand" the number of units will always be "1"
    name: number_of_units
    required: true
    type: Decimal
  - default: null
    description: Type of meal eaten. Valid meal types are "breakfast", "lunch", "dinner" and "other"
    name: meal
    required: true
    type: String
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  parse_warnings: []
  premier: true
  response:
    food_entries:
      food_entry:
      - {}
  rest_url: null
  scope: basic
  version: v1
