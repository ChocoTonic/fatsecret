  doc_url: https://platform.fatsecret.com/docs/v1/food_entries.get
  exists: true
  http_verb: GET
  method: food_entries.get
  notes: Returns saved food diary entries for the user according to the filter specified. This method
    can be used to return all food diary entries recorded on a nominated date or a single food diary entry
    with a nominated food_entry_id.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Number of days since January 1, 1970 (default value is the current day)
    name: date
    required: false
    type: Int
  - default: null
    description: Unique identifier of the food diary entry
    name: food_entry_id
    required: false
    type: Long
  parse_warnings: []
  premier: true
  response:
    food_entries:
      food_entry:
      - {}
  rest_url: null
  scope: basic
  version: v1
