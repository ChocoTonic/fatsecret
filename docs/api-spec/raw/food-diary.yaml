- api_method_param: null
  deprecated: false
  doc_url: https://platform.fatsecret.com/docs/v1/food_entry.edit
  exists: true
  http_verb: PUT
  method: food_entry.edit
  notes: Adjusts the recorded values for a food diary entry. Note that the date of the entry may not be
    adjusted, however one or more of the other remaining properties – food_entry_name, serving_id, number_of_units,
    or meal may be altered. In order to shift the date for which a food diary entry was recorded the original
    entry must be deleted and a new entry recorded.
  oauth:
  - oauth1
  - oauth2
  parameters:
  - default: null
    description: Unique identifier of the food diary entry
    name: food_entry_id
    required: true
    type: Long
  - default: null
    description: 'A description of the food item as entered by the user; typically the name of the food.
      E.G.: "Instant Oatmeal"'
    name: food_entry_name
    required: false
    type: String
  - default: null
    description: Unique serving identifier
    name: serving_id
    required: false
    type: Long
  - default: null
    description: Number of units in this standard serving size. For instance, if the serving description
      is "2 tablespoons" the number of units is "2", while if the serving size is "1 cup" the number of
      units is "1". Please note that this is only applicable for when food_type is "Generic" whereas for
      "Brand" the number of units will always be "1"
    name: number_of_units
    required: false
    type: Decimal
  - default: null
    description: Type of meal eaten. Valid meal types are "breakfast", "lunch", "dinner" and "other"
    name: meal
    required: false
    type: String
  parse_warnings: []
  premier: true
  response:
    success: 1
  rest_url: null
  scope: basic
  version: v1
