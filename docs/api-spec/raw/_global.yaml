    - code: 103
      type: Parameter
      message: "Invalid double value: '<details>'"
    - code: 104
      type: Parameter
      message: "Invalid decimal value: '<details>'"
    - code: 105
      type: Parameter
      message: "Invalid long value: '<details>'"
    - code: 106
      type: Parameter
