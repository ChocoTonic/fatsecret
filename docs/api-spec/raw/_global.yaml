localization:
  scope_required: localization (premier feature)
  parameters:
    region:
      format: ISO 3166-1 alpha-2
      example: FR
      notes: When omitted, defaults to US.
    language:
      format: ISO 639-1
      notes: Only applied when `region` is also specified; otherwise ignored.
  resolution_rules:
    - condition: neither parameter specified
      result: defaults to US region, English language
    - condition: region only
      result: uses that region's default language
    - condition: both parameters specified
      result: returns results in nominated region and language
  supported_regions_count: 195
  supported_regions_examples:
    - { code: US, default_language: English }
    - { code: GB, default_language: English }
    - { code: FR, default_language: French }
    - { code: DE, default_language: German }
    - { code: JP, default_language: Japanese }
    - { code: BR, default_language: Portuguese }
    - { code: CN, default_language: Chinese }
    - { code: AU, default_language: English }
    - { code: CA, default_language: English }
  supported_languages:
    - Arabic
    - Chinese
    - Chinese (Traditional)
    - Danish
    - Dutch
    - English
    - English (Canada)
    - English (Regional)
    - Finnish
    - French
    - German
    - Indonesian
    - Italian
    - Japanese
    - Korean
    - Norwegian
    - Polish
    - Portuguese
    - Portuguese (Portugal)
    - Russian
    - Spanish
    - Swedish
    - Thai
    - Turkish
    - Ukrainian
    - Vietnamese
  notes: >
    Localization is a premium feature only made available to select
    accounts for specific languages and regions. The language parameter
    is deliberately ignored unless region is simultaneously specified.

libraries:
  official:
    - name: Postman
      type: API testing / collection
      walkthrough: https://github.com/fatsecret-group/postman-fatsecret-apis
      workspace: https://www.postman.com/fatsecret/workspace/fatsecret-public-apis/collection/25958240-f307c228-34ed-42bb-8866-79dae97523a6
  community:
    - language: Python
      name: pyfatsecret
      url: https://github.com/walexnelson/pyfatsecret
    - language: PHP
      name: fatsecret-laravel
      url: https://github.com/Braunson/fatsecret-laravel
    - language: Swift
      name: FatSecretSwift
      url: https://github.com/NicholasBellucci/FatSecretSwift
      warning: >
        FatSecret notes this library is intended ONLY as a proof of concept
        because it stores credentials in plain text; a proxy service is
        recommended instead.
  community_disclaimer: >
    Community libraries are not affiliated with FatSecret; they are
    maintained by the developer community.
  support_forum: https://groups.google.com/g/fatsecret-platform-api
