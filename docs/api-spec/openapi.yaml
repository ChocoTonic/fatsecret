  /rest/server.api#exercise_entries.save_template:
    post:
      description: 'Takes the set of exercise entries on a nominated date and saves these entries as "template"
        entries for nominated days of the week. By default, the template daily exercise entries for all
        users for all days of the week are: his method is used to take the saved entries on for a nominated
        date and to copy them for one or more days of the week as the template daily exercise entries.
        So, for instance, if a user records 1 hour of walking, 8 hours of sleeping and 15 hours of resting
        for a particular day in their exercise diary, and then saves that date as a template for Saturday
        and Sunday, these three activities will be presented as the default exercise entries for all future
        Saturdays and Sundays.'
      operationId: exercise_entries_save_template_v1
      parameters:
      - description: FatSecret API method selector.
        in: query
        name: method
        required: true
        schema:
          enum:
          - exercise_entries.save_template
          type: string
      - description: The days of the week specified as bits with Sunday being the 1st bit and Saturday
          being the last and then converted to an Int. For example Tuesday and Thursday would be represented
          as 00010100 in bits or 20 in Int where Tuesday is the 3rd bit from the right and Thursday being
          the 5th. Must be between 0 and 128
        in: query
        name: days
        required: true
        schema:
          type: integer
      - description: Number of days since January 1, 1970 (default value is the current day)
        in: query
        name: date
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseEntriesSaveTemplateV1Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - basic
      - oauth1: []
      summary: exercise_entries.save_template (v1)
      tags:
      - Exercise Diary
      x-fatsecret-premier: true
      x-fatsecret-typed-response: false
  /rest/server.api#exercise_entry.edit:
    post:
      description: Records a change to a user's exercise diary entry for a nominated date. All changes
        to an exercise diary involve either increasing the duration of an existing activity or introducing
        a new activity for a nominated duration. Because there are always 24 hours worth of exercise entries
        on any given date, the user must nominate the exercise or activity from which the time was taken
        to balance out the total duration of activities and exercises for the 24 hour period. As such,
        each change to the exercise entries on a given day is a "shifting" operation where time is moved
        from one activity to another. An exercise is removed from the day when all of the time allocated
        to it is shifted to other exercises.
      operationId: exercise_entry_edit_v1
      parameters:
      - description: FatSecret API method selector.
        in: query
        name: method
        required: true
        schema:
          enum:
          - exercise_entry.edit
          type: string
      - description: ID of the exercise type to shift to
        in: query
        name: shift_to_id
        required: true
        schema:
          type: integer
      - description: ID of the exercise type to shift from
        in: query
        name: shift_from_id
        required: true
        schema:
          type: integer
      - description: Duration in minutes
        in: query
        name: minutes
        required: true
        schema:
          type: integer
      - description: Number of days since January 1, 1970 (default value is the current day)
        in: query
        name: date
        required: false
        schema:
          type: integer
      - description: Only required if shift_to_id is 0 (exercise type "Other"). This is the name of the
          new custom exercise type to shift to
        in: query
        name: shift_to_name
        required: false
        schema:
          type: string
      - description: Only required if shift_from_id is 0 (exercise type "Other"). This is the name of
          the custom exercise type to shift from
        in: query
        name: shift_from_name
        required: false
        schema:
          type: string
      - description: Only required if shift_to_id is 0 (exercise type "Other"). This is the total number
          of kcals burned for this exercise
        in: query
        name: kcal
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseEntryEditV1Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - basic
      - oauth1: []
      summary: exercise_entry.edit (v1)
      tags:
      - Exercise Diary
      x-fatsecret-premier: true
      x-fatsecret-typed-response: false
