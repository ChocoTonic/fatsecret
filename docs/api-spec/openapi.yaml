        specified. Barcodes must be specified as GTIN-13 numbers - a 13-digit number filled in with zeros
        for the spaces to the left. UPC-A, EAN-13 and EAN-8 barcodes may be specified. UPC-E barcodes
        should be converted to their UPC-A equivalent (and then specified as GTIN-13 numbers). An interactive
        demonstration of our Barcode API can be accessed here
      operationId: food_find_id_for_barcode_v2
      parameters:
      - description: FatSecret API method selector.
        in: query
        name: method
        required: true
        schema:
          enum:
          - food.find_id_for_barcode.v2
          type: string
      - description: 13-digit GTIN-13 formatted sequence of digits representing the barcode to search
          against
        in: query
        name: barcode
        required: true
        schema:
          type: string
      - description: Response will include the names of all sub categories associated with the food
        in: query
        name: include_sub_categories
        required: false
        schema:
          type: boolean
      - description: Response will include food image in the response. (Requires separate premier offering,
          please contact us in order for this feature to be enabled for your account)
        in: query
        name: include_food_images
        required: false
        schema:
          type: boolean
      - description: Response will include food dietary preferences and allergens if available. (Requires
          separate premier offering, please contact us in order for this feature to be enabled for your
          account)
        in: query
        name: include_food_attributes
        required: false
        schema:
          type: boolean
      - description: Either "true" or "false" - the response will flag one of the servings as the default
          serving (the suggested or most commonly chosen option)
        in: query
        name: flag_default_serving
        required: false
        schema:
          type: boolean
      - description: 'Results will be filtered by region. E.G.: "FR" returns results from France. If not
          specified this will default to "US" (United States). Click here for full documentation on localization.'
        in: query
        name: region
        required: false
        schema:
          type: string
      - description: '(Ignored unless region is also specified) Results will be in the specified language.
          E.G.: "fr" returns results in French'
        in: query
        name: language
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodFindIdForBarcodeV2Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - basic
      - oauth1: []
      summary: food.find_id_for_barcode (v2)
      tags:
      - Foods
      x-fatsecret-premier: true
      x-fatsecret-typed-response: true
