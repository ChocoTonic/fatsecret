  https://platform.fatsecret.com/rest/feedback/v1:
    post:
      operationId: feedback_v1
      parameters:
      - description: A barcode where a food is associated incorrectly. Required when issue_type_id is
          1
        in: query
        name: barcode
        required: true
        schema:
          type: integer
      - description: The type ID for the request. Valid options are 1 (Wrong Name/Brand), 2 (Wrong Nutrition
          Info), 3 (Missing Serving Size), 4 (Barcode not found), 99 (Other)
        in: query
        name: issue_type_id
        required: true
        schema:
          type: integer
      - description: Issue description. This is to be provided when the issue_type_id is 99 (Other)
        in: query
        name: issue_type
        required: false
        schema:
          type: string
      - description: Custom notes regarding the issue
        in: query
        name: notes
        required: false
        schema:
          type: string
      - description: Custom identifier for external use. E.g an external unique user identifier
        in: query
        name: external_id
        required: true
        schema:
          type: string
      - description: A food ID that is related to the issue (i.e. barcode incorrect food attached). Required
          when issue_type_id is 1, 2 or 3
        in: query
        name: returned_food.food_id
        required: false
        schema:
          type: integer
      - description: A foods serving ID that is related to the issue (i.e. incorrect nutrient information).
          Required when issue_type_id is 2 or 3
        in: query
        name: returned_food.serving_id
        required: false
        schema:
          type: integer
      - description: The image file extension in which the signed uploads will be generated using. Accepts
          jpg, jpeg, png and tiff. Defaulted to jpg if not provided
        in: query
        name: image_file_extension
        required: false
        schema:
          type: string
      - description: 'Results will be filtered by region. E.G.: "FR" returns results from France. If not
          specified this will default to "US" (United States). Click here for full documentation on localization.'
        in: query
        name: region
        required: false
        schema:
          type: string
      - description: '(Ignored unless region is also specified) Results will be in the specified language.
          E.G.: "fr" returns results in French'
        in: query
        name: language
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackV1Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - barcode
      - oauth1: []
      summary: feedback (v1)
      tags:
      - Feedback
      x-fatsecret-premier: true
      x-fatsecret-typed-response: false
