      description: 'This API detects foods within an image and returns a list of foods from the fatsecret
        database By passing a list of eaten foods, we will also attempt to determine if any of the inputs
        match in order to improve the accuracy of the response. NOTE: If an appropriate serving is not
        found, nutritional information may not be present. This typically occurs when a non-standard serving
        description is provided for a restaurant-based food. In such scenarios, we recommend using the
        default serving size returned via the API, indicated by the serving object with "is_default":
        true. Additionally, for mobile app interfaces, we recommend not automatically logging all foods
        and associated serving amounts directly into the user''s food diary. Instead, we recommend displaying
        an intermittent screen that allows the user to: This approach improves user experience and ensures
        more accurate food diary entries. NOTE: The entire request body is limited to 1MB characters (1.048M)
        and as such we recommend to check the request size before hitting the API.'
      operationId: image_recognition_v1
      parameters:
      - description: A Base64 image of one or more foods. This field is limited to 999,982 characters
        in: query
        name: image_b64
        required: true
        schema:
          type: string
