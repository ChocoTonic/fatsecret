  /rest/server.api#foods.search:
    get:
      description: Conducts a search of the food database using the search expression specified. The results
        are paginated according to a zero-based "page" offset. Successive pages of results may be retrieved
        by specifying a starting page offset value. For instance, specifying a max_results of 10 and page_number
        of 4 will return results numbered 41-50. Search results will be refined according to the user's
        prior saved food entries. An interactive demonstration of our Food Search API can be accessed
        here
      operationId: foods_search_v1
      parameters:
      - description: FatSecret API method selector.
        in: query
        name: method
        required: true
        schema:
          enum:
          - foods.search
          type: string
      - description: Search expression to match on food names
        in: query
        name: search_expression
        required: false
        schema:
          type: string
      - description: Zero-based offset into the results for the query
        in: query
        name: page_number
        required: false
        schema:
          type: integer
      - description: Maximum number of results to return (default value is 20). This number cannot be
          greater than 50
        in: query
        name: max_results
        required: false
        schema:
          type: integer
      - description: 'Either "weight" or "portion": Weight (default) - the summary description for key
          nutritional values is displayed by weight (typically 100g); E.G.: "Per 100g". Portion - the
          summary description for key nutritional values is displayed using the default portion size;
          E.G.: "Per 1 Cup" Note that the summary nutrition description for "Brand" food items is always
          shown using a "portion" based description'
        in: query
        name: generic_description
        required: false
        schema:
          type: string
      - description: 'Results will be filtered by region. E.G.: "FR" returns results from France. If not
          specified this will default to "US" (United States). Click here for full documentation on localization.'
        in: query
        name: region
        required: false
        schema:
          type: string
      - description: '(Ignored unless region is also specified) Results will be in the specified language.
          E.G.: "fr" returns results in French'
        in: query
        name: language
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodsSearchV1Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - basic
      - oauth1: []
      summary: foods.search (v1)
      tags:
      - Foods
      x-fatsecret-premier: true
      x-fatsecret-typed-response: true
