paths:
  /rest/server.api#exercise_entries.commit_day:
    post:
      description: Saves the default exercise entries for the user on a nominated date. The API will always
        return 24 hours worth of exercise entries for a given user on a given date. Users can set up and
        save standard routines for the activities they do on any given day of the week, known as "template"
        exercise entries. When the exercise entries are retrieved for a day that has not previously been
        committed or adjusted by the user a set of 24 hours worth of "template" or default entries will
        be returned. The exercise_entries.commit_day method takes the current "template" exercise entries
        and saves them to the exercise diary. Calling this method is in effect an acknowledgement on behalf
        of a user that they undertook the activities presented in the template.
      operationId: exercise_entries_commit_day_v1
      parameters:
      - description: FatSecret API method selector.
        in: query
        name: method
        required: true
        schema:
          enum:
          - exercise_entries.commit_day
          type: string
      - description: Number of days since January 1, 1970 (default value is the current day)
        in: query
        name: date
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseEntriesCommitDayV1Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - basic
      - oauth1: []
      summary: exercise_entries.commit_day (v1)
      tags:
      - Exercise Diary
      x-fatsecret-premier: true
      x-fatsecret-typed-response: false
  /rest/server.api#exercise_entries.get:
    get:
      deprecated: true
      description: Returns the daily exercise entries for the user on a nominated date. The API will always
        return 24 hours worth of exercise entries for a given user on a given date. These entries will
        either be "template" entries (which a user may override for any given day of the week) or saved
        exercise entry values. Once a user saves or updates the entries on any given day, all entries
        for that day are saved. All adjustments to the day involve reducing the time for an existing activity
        in order to either add or increase the time taken for another activity. The default entries presented
        for a user for a given day of the week can be overridden using exercise_entries.save_template.
      operationId: exercise_entries_get_v1
      parameters:
      - description: FatSecret API method selector.
        in: query
        name: method
        required: true
        schema:
          enum:
          - exercise_entries.get
          type: string
      - description: Number of days since January 1, 1970 (default value is the current day)
        in: query
        name: date
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseEntriesGetV1Response'
          description: Successful response.
        default:
          $ref: '#/components/responses/Error'
      security:
      - oauth2:
        - basic
      - oauth1: []
      summary: exercise_entries.get (v1)
      tags:
      - Exercise Diary
      x-fatsecret-premier: true
      x-fatsecret-typed-response: true
