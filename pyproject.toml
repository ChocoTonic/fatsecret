[project]
name = "fatsecret"
version = "3.1.3"
description = "Python wrapper for the Fatsecret API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4",
    "lxml",
    "pydantic>=2.7",
    "python-dotenv",
    "requests==2.34.2",
    "requests-oauthlib>=2.0.0",
    "tenacity>=9.0",
]

[project.urls]
Documentation = "https://fatsecret.readthedocs.io/"
Source = "https://github.com/ChocoTonic/fatsecret"
Issues = "https://github.com/ChocoTonic/fatsecret/issues"
Changelog = "https://github.com/ChocoTonic/fatsecret/releases"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: mark a test as an integration test"]
filterwarnings = [
    # Suppress our own deprecation warnings inside the test suite. The
    # legacy aliases call `warnings.warn(stacklevel=2)` so the warning
    # registers as coming from the test file, not the fatsecret module —
    # match by message instead of module.
    "ignore:Fatsecret\\..*is deprecated.*:DeprecationWarning",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "pytest-cov",
    "pytest",
    "ruff",
    "furo>=2024.8.6",
    "sphinx>=7.4.7",
    "pyyaml>=6.0",
    "autodoc-pydantic>=2.0",
    "readthedocs-sphinx-search>=0.3.2",
]
