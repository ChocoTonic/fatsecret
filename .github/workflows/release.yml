name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      test-type: 'all'

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FATSECRET_CONSUMER_KEY: ${{ secrets.FATSECRET_CONSUMER_KEY }}
      FATSECRET_CONSUMER_SECRET: ${{ secrets.FATSECRET_CONSUMER_SECRET }}
      FATSECRET_USERNAME: ${{ secrets.FATSECRET_USERNAME }}
      FATSECRET_PASSWORD: ${{ secrets.FATSECRET_PASSWORD }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin master
          CURRENT=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          COMMIT_MSG=$(git log -1 --pretty=%B)
          IS_DEPENDABOT=${{ github.actor == 'dependabot[bot]' }}

          # Dependabot or CVE → patch bump; all other commits → minor bump
          if [ "$IS_DEPENDABOT" = "true" ]; then
            if echo "$COMMIT_MSG" | grep -qi "CVE\|security\|vulnerability"; then
              NEW="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Skipping: dependabot bump without CVE"
              exit 0
            fi
          else
            NEW="$MAJOR.$((MINOR + 1)).0"
          fi

          # Skip if tag already exists
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: tag v$NEW already exists"
            exit 0
          fi

          sed -i "s/version = \"$CURRENT\"/version = \"$NEW\"/" pyproject.toml
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "tag=v$NEW" >> $GITHUB_OUTPUT

      - name: Commit and tag version bump
        if: steps.version.outputs.skip == 'false'
        run: |
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }} master --tags

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to PyPI
        if: steps.version.outputs.skip == 'false'
        run: make release
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
