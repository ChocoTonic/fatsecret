name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      test-type: 'all'

  release:
    needs: test
    runs-on: ubuntu-latest

    env:
      FATSECRET_CONSUMER_KEY: ${{ secrets.FATSECRET_CONSUMER_KEY }}
      FATSECRET_CONSUMER_SECRET: ${{ secrets.FATSECRET_CONSUMER_SECRET }}
      FATSECRET_USERNAME: ${{ secrets.FATSECRET_USERNAME }}
      FATSECRET_PASSWORD: ${{ secrets.FATSECRET_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check if release should run
        id: should_release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)

          # Only dep files changed?
          if echo "$CHANGED_FILES" | grep -qvE '^(uv\.lock|pyproject\.toml)$'; then
            IS_DEP_BUMP=false
          else
            IS_DEP_BUMP=true
          fi

          # CVE/security mentioned?
          if echo "$COMMIT_MSG" | grep -qi "CVE\|security\|vulnerability"; then
            HAS_CVE=true
          else
            HAS_CVE=false
          fi

          if [ "$IS_DEP_BUMP" = "true" ] && [ "$HAS_CVE" = "false" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: dependency bump without CVE"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from pyproject.toml
        if: steps.should_release.outputs.skip == 'false'
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        if: steps.should_release.outputs.skip == 'false'
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create git tag
        if: steps.should_release.outputs.skip == 'false' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.should_release.outputs.skip == 'false' && steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to PyPI
        if: steps.should_release.outputs.skip == 'false'
        run: make release
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
