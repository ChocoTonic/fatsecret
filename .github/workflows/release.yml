name: Release

on:
  push:
    branches:
      - master
    # Glob syntax (not regex). `*` matches any chars except `/`; `.` is
    # literal. `v*.*.*` matches v1.0.0, v1.10.3, etc. The previous pattern
    # `v[0-9]+.[0-9]+.[0-9]+` used regex syntax in a glob filter and never
    # matched anything.
    tags:
      - "v*.*.*"

  # Manual republish for tags whose underlying commit doesn't carry the
  # `on: push: tags:` trigger (historical commits predating this workflow
  # update). Run:
  #   gh workflow run release.yml -f tag=v1.0.0
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. "v1.0.0".'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    # Skip on tag pushes and manual republishes — the tag points at a
    # green-CI'd master commit, re-running tests just burns minutes.
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      test-type: "all"

  release:
    needs: [test]
    if: |
      always() &&
      (github.ref_type == 'tag'
       || github.event_name == 'workflow_dispatch'
       || needs.test.result == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FATSECRET_CONSUMER_KEY: ${{ secrets.FATSECRET_CONSUMER_KEY }}
      FATSECRET_CONSUMER_SECRET: ${{ secrets.FATSECRET_CONSUMER_SECRET }}
      FATSECRET_USERNAME: ${{ secrets.FATSECRET_USERNAME }}
      FATSECRET_PASSWORD: ${{ secrets.FATSECRET_PASSWORD }}

    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compute version
        id: version
        run: |
          set -euo pipefail

          # Three trigger modes:
          #   * workflow_dispatch     — use inputs.tag verbatim
          #   * tag push (ref_type=tag) — use the tag verbatim
          #   * branch push to master — derive bump from conventional
          #                             commits since the latest tag

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            NEW="${{ inputs.tag }}"
            NEW="${NEW#v}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=${NEW}" >> "$GITHUB_OUTPUT"
            echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: publishing v${NEW}"
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NEW="${GITHUB_REF_NAME#v}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=${NEW}" >> "$GITHUB_OUTPUT"
            echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Tag push: publishing ${NEW} as-is"
            exit 0
          fi

          # --- branch push: compute next version from commit history ---
          CURRENT=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1 \
            | tr -d 'v')
          if [ -z "${CURRENT}" ]; then
            CURRENT="0.0.0"
            RANGE="HEAD"
          else
            RANGE="v${CURRENT}..HEAD"
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # Union of every commit message (subject + body) since the
          # latest tag. One breaking commit in the range forces a major
          # bump even if everything else is a patch.
          COMMITS=$(git log --format='%B%n---commit-boundary---' "${RANGE}")

          IS_DEPENDABOT=${{ github.actor == 'dependabot[bot]' }}

          # Conventional-commit detection (anchored prefixes; prose-safe):
          #   * `feat!:` / `fix!:` / ... / `BREAKING CHANGE:` -> major
          #   * `feat:` / `feat(scope):` -> minor
          #   * everything else (fix, docs, test, chore, refactor, ...) -> patch
          BUMP="patch"
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^BREAKING[ -]CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          if [ "$IS_DEPENDABOT" = "true" ]; then
            if echo "$COMMITS" | grep -qiE 'CVE|security|vulnerability'; then
              BUMP="patch"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping: dependabot bump without CVE keyword"
              exit 0
            fi
          fi

          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Latest tag: v${CURRENT}"
          echo "Bump type:  ${BUMP}"
          echo "Next ver:   v${NEW}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

      - name: Tag release (branch push only)
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.create_tag == 'true'
        run: |
          sed -i "s/version = \"[^\"]*\"/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push https://x-access-token:${{ secrets.RELEASE_PAT }}@github.com/${{ github.repository }} "${{ steps.version.outputs.tag }}"

      - name: Sync pyproject.toml to tag version (tag or dispatch)
        if: steps.version.outputs.skip == 'false' && steps.version.outputs.create_tag != 'true'
        run: |
          # Tag pushes and workflow_dispatch may point at historical
          # commits whose pyproject.toml carries an older version field.
          # Re-sync without committing so uv publishes the correct version.
          sed -i "s/version = \"[^\"]*\"/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml

      - name: Check if version already on PyPI
        id: pypi_check
        if: steps.version.outputs.skip == 'false'
        run: |
          # Idempotency: a branch-push run cuts the new tag and pushes it
          # to origin via RELEASE_PAT. That tag push fires a SECOND workflow
          # run (the `tags:` trigger). Both runs target the same version.
          # First one publishes successfully; second one would 400 on PyPI
          # ("File already exists"). Skip publish when PyPI already has it.
          #
          # Check BOTH the JSON API and the `simple/` index — they have
          # different CDN cache behavior, and either may reflect a fresh
          # upload sooner than the other.
          VERSION="${{ steps.version.outputs.version }}"
          found="false"
          if curl -sf -o /dev/null "https://pypi.org/pypi/fatsecret/${VERSION}/json"; then
            found="true"
          elif curl -sf -H "Accept: application/vnd.pypi.simple.v1+json" \
                "https://pypi.org/simple/fatsecret/" \
              | grep -q "\"${VERSION}\""; then
            found="true"
          fi
          if [ "$found" = "true" ]; then
            echo "fatsecret==${VERSION} already on PyPI; skipping publish."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "fatsecret==${VERSION} not on PyPI yet; will attempt publish."
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if GitHub Release already exists
        id: gh_release_check
        if: steps.version.outputs.skip == 'false' && steps.pypi_check.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release ${{ steps.version.outputs.tag }} already exists; skipping create."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Release ${{ steps.version.outputs.tag }} does not exist; will create."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: |
          steps.version.outputs.skip == 'false'
          && steps.pypi_check.outputs.already != 'true'
          && steps.gh_release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to PyPI
        if: steps.version.outputs.skip == 'false' && steps.pypi_check.outputs.already != 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Idempotency for the upload race: PyPI's JSON / simple indices
          # are CDN-cached and may still 404 for ~30-60s after a successful
          # upload from a concurrent run. If `make release` fails solely
          # because the file already exists, treat that as success — the
          # concurrent run won the race and the artifact is on PyPI.
          set -o pipefail
          if make release 2>&1 | tee /tmp/publish.log; then
            exit 0
          fi
          if grep -q "File already exists" /tmp/publish.log; then
            echo "::warning::PyPI says file already exists — treating as success (concurrent run won the upload race)."
            exit 0
          fi
          echo "::error::PyPI publish failed for a reason other than duplicate-file."
          exit 1
