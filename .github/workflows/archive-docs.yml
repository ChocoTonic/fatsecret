# Builds a static, version-pinned docs archive for every released tag of
# fatsecret and publishes it to the `gh-pages` branch at the root so URLs
# of the form `https://chocotonic.github.io/fatsecret/vX.Y.Z/` always work.
# Also publishes `latest/` (tracks master) and `stable/` (redirects to the
# highest released tag) at the gh-pages root.
#
# Triggers:
#   * push of a `vX.Y.Z` tag       -> incremental: build only that tag,
#                                     preserve every previously-published
#                                     per-version directory. Also rebuild
#                                     latest/ and refresh stable/.
#   * push to `master` (selected   -> only rebuild latest/, preserve all
#     paths)                          existing tag directories and stable/.
#   * workflow_dispatch (manual)   -> full refresh: rebuild every tag from
#                                     scratch, plus latest/ + stable/.

name: archive-docs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/build-version-docs/**"

permissions:
  contents: write

env:
  # peaceiris/actions-gh-pages@v4 is still on Node 20 (no v5 yet). Opt
  # into the Node 24 runtime to silence the deprecation warning. Drop
  # this once peaceiris cuts a Node-24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Determine build mode
        id: mode
        run: |
          # Branch push to master -> refresh only latest/.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            echo "extra_args=--only-current" >> "$GITHUB_OUTPUT"
            echo "keep_files=true" >> "$GITHUB_OUTPUT"
            echo "Master push: rebuilding only latest/"
          # Tag push -> incremental, build that tag + refresh latest/+stable/.
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "extra_args=--build-current --tags ${tag}" >> "$GITHUB_OUTPUT"
            echo "keep_files=true" >> "$GITHUB_OUTPUT"
            echo "Incremental build for ${tag} (plus latest/ + stable/)"
          # Manual -> full refresh.
          else
            echo "extra_args=--build-current" >> "$GITHUB_OUTPUT"
            echo "keep_files=false" >> "$GITHUB_OUTPUT"
            echo "Full refresh: rebuilding every vX.Y.Z tag plus latest/ + stable/"
          fi

      - name: Build per-version docs archive
        run: |
          bash scripts/build-version-docs/build.sh ${{ steps.mode.outputs.extra_args }}

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./legacy-staging
          # On a tag push we only built one version; keep the others.
          # On a master push we only built latest/; keep everything else.
          # On a manual full refresh we rebuilt everything and want stale
          # entries cleared out.
          keep_files: ${{ steps.mode.outputs.keep_files }}
          commit_message: "docs: publish per-version docs archive"
