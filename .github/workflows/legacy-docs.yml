# One-shot manual workflow that builds a static archive of pyfatsecret docs
# for every released tag prior to v0.13.0 and publishes it to the `gh-pages`
# branch under `/legacy/<tag>/`.
#
# Why manual-only:
#   * Read the Docs handles modern docs (v0.13.0+) automatically.
#   * The legacy archive is frozen by intent — it covers tags that will never
#     change, so rebuilding on every push would be pure waste.
#
# Usage:
#   gh workflow run legacy-docs.yml
#
# Permissions: this workflow force-pushes to `gh-pages`. The previous
# `gh-pages.yml` rebuild workflow was deleted in PR #97, so the existing
# `gh-pages` content is already obsolete.

name: legacy-docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Build legacy docs archive
        run: bash scripts/build-legacy-docs/build.sh

      - name: Publish to gh-pages under /legacy/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./legacy-staging
          # Keep any pre-existing gh-pages content that isn't under /legacy/.
          # The action's default is to replace the whole branch; we explicitly
          # request keep_files so the modern RTD link / 404 page / etc. aren't
          # clobbered if anyone has placed them there.
          keep_files: true
          commit_message: "docs: publish frozen legacy docs archive (pre-v0.13.0)"
